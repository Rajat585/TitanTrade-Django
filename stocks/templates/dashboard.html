{% extends 'base.html' %}
{% load static %}
{% block title %}Dashboard - Titan Trade{% endblock %}
{% block content %}
<div class="container mt-5">
  <h2 class="text-center text-primary mb-4">Live Market Dashboard</h2>
  <hr />
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#chartModal">
    View Chart
  </button>

  <table class="table table-dark table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Symbol</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      {% for stock in stocks %}
      <tr>
        <td>{{ stock.name }}</td>
        <td>{{ stock.symbol }}</td>
        <td>{{ stock.price }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <!-- Chart Modal -->
  <div class="modal fade" id="chartModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title">Stock Chart</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <canvas id="stockChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const chartModal = document.getElementById('chartModal');
      let stockChart;

      chartModal.addEventListener('shown.bs.modal', function () {
        const ctx = document.getElementById('stockChart').getContext('2d');

        if (!stockChart) {
          stockChart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: {{ chart_labels|safe }},
              datasets: [{
                label: 'Stock Prices',
                data: {{ chart_data|safe }},
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
              }]
            },
            options: {
              responsive: true,
              scales: {
                y: { beginAtZero: true }
              }
            }
          });
        } else {
          stockChart.resize();
        }
      });
    });
  </script>
</div>
{% endblock %}
