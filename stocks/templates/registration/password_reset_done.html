{% extends 'base.html' %}
{% block title %}Password Reset Sent{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow-lg p-4">
      <h2 class="text-center text-primary mb-4">Password Reset Email Sent</h2>
      <p class="text-center text-muted">
        We have emailed you instructions for setting your password. If you do not receive the email, please check your spam folder.
      </p>
      <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="btn btn-primary">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
